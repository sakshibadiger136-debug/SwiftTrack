services:

  mongodb:
    image: mongo:7
    container_name: swifttrack-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./Backend
    container_name: swifttrack-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/courierTrackingDB
    depends_on:
      - mongodb

  frontend:
    build: ./Frontend
    container_name: swifttrack-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data: